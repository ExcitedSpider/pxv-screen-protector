# Copy to ~/.config/pixiv-slides/config.toml and fill in your refresh token.

refresh_token = "PASTE_YOUR_REFRESH_TOKEN_HERE"

# Optional (defaults shown):
feed_mode = "following_daily"        # "following_daily" or "tag_search"
slide_interval_secs = 300            # 5 minutes between slides
max_pages_per_post = 3               # cap on images shown per multi-page post
empty_day_fallback = true            # if yesterday is empty, show today-so-far
avoid_nsfw = false                   # if true, exclude works not marked as general content
save_dir = "~/Pictures/pixiv-slides" # where pressing `s` saves illustrations
bookmark_on_save = false             # if true, `s` also adds a Pixiv bookmark
bookmark_restrict = "private"        # "private" or "public"
bookmark_tags = []                   # optional Pixiv bookmark tags
cache_max_mb = 512                   # on-disk image cache cap in MB (0 disables)

# Used only when feed_mode = "tag_search".
[tag_feed]
tags = ["landscape", "original"]     # searched independently, then merged
exclude_tags = []                     # discard works carrying any exact tag match
follow_when_bookmark = false         # after a successful `s` bookmark, publicly follow its author
range_days = 30                      # local days, inclusive of today
search_target = "exact_match_for_tags"
sort = "popular_desc"                # Pixiv Premium popularity sort
max_results_per_tag = 30
min_bookmarks = 0                    # drop tag results below this bookmark count
max_search_pages_per_tag = 10        # safety cap, mainly for fallback mode
max_slides = 120
fallback_without_popular_sort = "error" # or "local_bookmark_sort"
merge_strategy = "raw_bookmarks"     # or "per_tag_rank", "median_like_ratio"
recency_decay_lambda = 0.15          # median_like_ratio only; 0 disables
