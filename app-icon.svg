<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background: idle-screen indigo, top-lit -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2A2C58"/>
      <stop offset="1" stop-color="#131431"/>
    </linearGradient>
    <!-- Soft glow behind the P -->
    <radialGradient id="glow" cx="0.52" cy="0.38" r="0.6">
      <stop offset="0" stop-color="#6A5BD8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6A5BD8" stop-opacity="0"/>
    </radialGradient>
    <!-- The slide photo: sunset -->
    <linearGradient id="photo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC168"/>
      <stop offset="0.55" stop-color="#FF8A5C"/>
      <stop offset="1" stop-color="#F65E7A"/>
    </linearGradient>
    <linearGradient id="hillA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A3D6B"/>
      <stop offset="1" stop-color="#592C55"/>
    </linearGradient>
    <clipPath id="cardClip">
      <rect x="158" y="118" width="224" height="180" rx="30"/>
    </clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#05060F" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Icon plate -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#bg)"/>
  <rect x="28" y="28" width="456" height="456" rx="104" fill="url(#glow)"/>
  <!-- Hairline top edge light -->
  <rect x="28" y="28" width="456" height="456" rx="104" fill="none"
        stroke="#8E86E8" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Echo slide: the previous photo sliding away -->
  <g transform="rotate(-7 270 208)">
    <rect x="176" y="112" width="224" height="180" rx="30"
          fill="#3C4078" opacity="0.75"/>
  </g>

  <!-- The P -->
  <g filter="url(#drop)">
    <!-- Bowl = current slide -->
    <rect x="158" y="118" width="224" height="180" rx="30" fill="url(#photo)"/>
    <g clip-path="url(#cardClip)">
      <!-- Sun -->
      <circle cx="316" cy="182" r="27" fill="#FFF4D8"/>
      <circle cx="316" cy="182" r="38" fill="#FFF4D8" opacity="0.25"/>
      <!-- Hills -->
      <path d="M 158 298 L 158 268 L 232 200 L 292 258 L 336 222 L 382 264 L 382 298 Z"
            fill="url(#hillA)"/>
      <path d="M 158 298 L 158 284 L 214 236 L 268 288 L 310 254 L 382 298 Z"
            fill="#3E1F49" opacity="0.85"/>
    </g>
    <!-- Slide edge highlight -->
    <rect x="158" y="118" width="224" height="180" rx="30" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="5"/>
    <!-- Stem -->
    <rect x="158" y="118" width="74" height="286" rx="24" fill="#F1EEFF"/>
  </g>
</svg>
